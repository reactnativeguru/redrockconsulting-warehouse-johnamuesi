server {
  listen 80;
  root /usr/share/nginx/html;

  # remoteEntry.js must never be cached: it's the pointer to the latest remote build.
  # Hashed chunks can be cached forever.
  location ~* remoteEntry\.js$ {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
