apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-portal
spec:
  replicas: 2
  selector:
    matchLabels: { app: admin-portal }
  template:
    metadata:
      labels: { app: admin-portal }
    spec:
      containers:
        - name: admin-portal
          image: basecamp/admin-portal:latest
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: admin-portal
spec:
  selector: { app: admin-portal }
  ports: [{ port: 80, targetPort: 80 }]
