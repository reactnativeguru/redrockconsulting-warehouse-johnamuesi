apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
spec:
  replicas: 2
  selector:
    matchLabels: { app: catalog }
  template:
    metadata:
      labels: { app: catalog }
    spec:
      containers:
        - name: catalog
          image: basecamp/catalog:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: basecamp-config }
            - secretRef: { name: basecamp-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { memory: 384Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false }
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
spec:
  selector: { app: catalog }
  ports: [{ port: 80, targetPort: 8080 }]
