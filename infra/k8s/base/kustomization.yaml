# Kustomize: plain YAML + per-environment overlays (no templating language).
#   kubectl apply -k infra/k8s/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: basecamp
resources:
  - namespace.yaml
  - config.yaml
  - catalog.yaml
  - inventory.yaml
  - orders.yaml
  - epos-etl.yaml
  - gateway.yaml
  - admin-portal.yaml
  - ingress.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: basecamp-retail
