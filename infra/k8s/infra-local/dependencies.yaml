apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq }
spec:
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: masstransit/rabbitmq:latest
          ports: [{ containerPort: 5672 }, { containerPort: 15672 }]
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq }
spec:
  selector: { app: rabbitmq }
  ports: [{ name: amqp, port: 5672 }, { name: ui, port: 15672 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mongo }
spec:
  selector: { matchLabels: { app: mongo } }
  template:
    metadata: { labels: { app: mongo } }
    spec:
      containers:
        - name: mongo
          image: mongo:8
          ports: [{ containerPort: 27017 }]
---
apiVersion: v1
kind: Service
metadata: { name: mongo }
spec:
  selector: { app: mongo }
  ports: [{ port: 27017 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: sqlserver }
spec:
  selector: { matchLabels: { app: sqlserver } }
  template:
    metadata: { labels: { app: sqlserver } }
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          env:
            - { name: ACCEPT_EULA, value: "Y" }
            - { name: MSSQL_SA_PASSWORD, value: "CHANGE_ME" }
          ports: [{ containerPort: 1433 }]
---
apiVersion: v1
kind: Service
metadata: { name: sqlserver }
spec:
  selector: { app: sqlserver }
  ports: [{ port: 1433 }]
